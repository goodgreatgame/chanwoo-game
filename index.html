async function loadCloudState(){if(!currentUser)return;try{const pendingName=localStorage.getItem("chanwooPendingUsername");if(pendingName){const profileUpdate=await sb.from("profiles").update({username:pendingName}).eq("id",currentUser.id);if(profileUpdate.error)console.warn("Profile update failed",profileUpdate.error.message);else localStorage.removeItem("chanwooPendingUsername");}if(localStorage.getItem("chanwooPendingNewAccount")==="1"){localStorage.removeItem("chanwooPendingNewAccount");await syncCloudState();subscribeRanking();return;}let result=await sb.from("player_stats").select("level,coins,gems,xp,attack,hp,game_data").eq("user_id",currentUser.id).maybeSingle();if(result.error&&/game_data|column/i.test(result.error.message))result=await sb.from("player_stats").select("level,coins,gems,xp,attack,hp").eq("user_id",currentUser.id).maybeSingle();const {data,error}=result;if(error){toast("게임 데이터 불러오기 실패: "+error.message);return;}if(data){S.level=data.level;S.coins=Number(data.coins);S.gems=data.gems;S.xp=data.xp;S.attack=data.attack;S.hp=data.hp;if(data.game_data&&typeof data.game_data==="object")S={...S,...data.game_data};saveLocalOnly();render();}else await syncCloudState();subscribeRanking();}catch(error){console.warn("Cloud load failed",error);toast("클라우드 불러오기 오류: "+(error.message||error));}}
function saveLocalOnly(){S.last=Date.now();localStorage.setItem("chanwooIdleSave",JSON.stringify(S));}
async function syncCloudState(manual=false){if(!currentUser)return false;try{const base={user_id:currentUser.id,level:S.level,coins:Math.floor(S.coins),gems:S.gems,xp:Math.floor(S.xp),attack:S.attack,hp:S.hp,updated_at:new Date().toISOString()};let {error}=await sb.from("player_stats").upsert({...base,game_data:S},{onConflict:"user_id"});if(error&&/game_data|column/i.test(error.message)){const fallback=await sb.from("player_stats").upsert(base,{onConflict:"user_id"});error=fallback.error;if(!error)console.info("Supabase game_data 컬럼이 없어 기본 능력치만 동기화됩니다.");}if(error){console.warn("Cloud save failed",error.message);if(manual)toast("클라우드 저장 오류: "+error.message);return false;}return true;}catch(error){console.warn("Cloud save failed",error);if(manual)toast("클라우드 연결 오류: "+(error.message||error));return false;}}
async function fetchRanking(){const c=$("content");if(!c||!c.querySelector("[data-online-ranking]"))return;const {data:stats,error}=await sb.from("player_stats").select("user_id,level,coins").order("level",{ascending:false}).order("coins",{ascending:false}).limit(50);if(error){c.innerHTML='<div data-online-ranking><h2 class="sectiontitle">🥇 온라인 랭킹</h2><p>랭킹을 불러오지 못했어요: '+escapeHtml(error.message)+'</p></div>';return;}const ids=(stats||[]).map(x=>x.user_id);let names={};if(ids.length){const {data:profiles}=await sb.from("profiles").select("id,username").in("id",ids);(profiles||[]).forEach(x=>names[x.id]=x.username);}if(!c.querySelector("[data-online-ranking]"))return;c.innerHTML='<div data-online-ranking><h2 class="sectiontitle">🥇 실시간 온라인 랭킹</h2>'+(stats||[]).map((x,i)=>`<div class="listitem"><b>${["🥇","🥈","🥉"][i]||`${i+1}위`} · ${escapeHtml(names[x.user_id]||"플레이어")}</b><b>Lv.${x.level} · ${Number(x.coins).toLocaleString()} 🪙</b></div>`).join("")+'<p class="tiny">가입한 플레이어의 서버 저장 데이터를 기준으로 표시합니다.</p></div>';
}

}
$("nav").onclick=e=>{let b=e.target.closest("button[data-tab]");if(b)tab(b.dataset.tab)};
$("content").onclick=e=>{let b=e.target.closest("button");if(!b)return;let i=+(b.dataset.skin??-1);if(i>=0){if(S.owned[i]){S.equipped=i;toast(skins[i].name+" 장착 완료!")}else if(i===3){toast("레벨 30을 달성하면 해금돼요!")}else if(S.coins>=skins[i].price){S.coins-=skins[i].price;S.owned[i]=true;S.equipped=i;toast("새 스킨을 획득했어요!")}else toast("코인이 부족해요!");save();render();tab("character")}
if(b.dataset.buy){let k=b.dataset.buy,cost=k==="hp"?800:k==="auto"?Math.floor(2500*Math.pow(1.55,S.autoLevel)):1000;if(S.coins>=cost){S.coins-=cost;if(k==="attack")S.attack+=5;if(k==="hp")S.hp+=50;if(k==="coin")S.coinLevel++;if(k==="auto")S.autoLevel++;toast("강화 완료!")}else toast("코인이 부족해요");save();render();tab("growth")}
if(b.dataset.useItem){useItem(b.dataset.useItem)}
if(b.dataset.shop){let k=b.dataset.shop,c=k==="gem"?2000:k==="ticket"?2500:itemCatalog[k]?.price;if(c!==undefined&&S.coins>=c){S.coins-=c;if(k==="gem")S.gems+=10;else S.items.push(k);toast(k==="gem"?"보석 10개 구매 완료!":(itemCatalog[k]?.name||"뽑기권")+" 구매 완료!")}else toast(c===undefined?"상품을 찾을 수 없어요":"코인이 부족해요");save();render();tab("shop")}
if(b.dataset.mission){let k=b.dataset.mission,defs={train:[5,500],earn:[10000,1000],click:[30,700],eggs:[2,1200]},d=defs[k],v=k==="eggs"?S.totalEggs:(S.missions[k]||0);if(d&&v>=d[0]&&!S.missionClaims.includes(k)){S.missionClaims.push(k);earnCoins(d[1]);toast("미션 보상 +"+fmt(d[1])+" 코인!")}else toast("아직 완료하지 않았거나 이미 받은 미션이에요!");save();render();tab("missions")}
if(b.dataset.achievement!==undefined){let i=+b.dataset.achievement,ach=[[S.level>=5,1000],[S.owned.filter(Boolean).length>=3,2500],[S.totalCoins>=20000,2000],[S.level>=100,10000],[new Set(S.pets).size>=3,3000],[S.totalClicks>=100,1500]],a=ach[i];if(a&&a[0]&&!S.achievementClaims.includes(i)){S.achievementClaims.push(i);S.achievements.push(i);earnCoins(a[1]);toast("업적 보상 +"+fmt(a[1])+" 코인!")}save();render();tab("achievements")}
if(b.hasAttribute("data-buy-egg")){if(S.coins<4000){toast("코인이 부족해요!")}else{S.coins-=4000;S.totalEggs++;let available=Object.keys(petCatalog),unowned=available.filter(id=>!S.pets.includes(id));if(unowned.length){let id=unowned[Math.floor(Math.random()*unowned.length)];S.pets.push(id);S.equippedPet=id;toast(petCatalog[id].icon+" "+petCatalog[id].name+" 발견!")}else{earnCoins(2500);toast("중복 알 보상 +2,500 코인!")}}save();render();tab("pets")}
if(b.dataset.equipPet){if(S.pets.includes(b.dataset.equipPet)){S.equippedPet=b.dataset.equipPet;toast(petCatalog[S.equippedPet].name+" 대표 펫 설정!");save();render();tab("pets")}}
if(b.dataset.decor!==undefined){let i=+b.dataset.decor,prices=[1000,2500,5000,800];if(!S.decor.includes(i)&&S.coins>=prices[i]){S.coins-=prices[i];S.decor.push(i);toast("방 꾸미기 아이템 획득!")}else toast("이미 보유했거나 코인이 부족해요");save();render();tab("room")}
if(b.id==="train2")$("train").click();
if(b.id==="draw"){if(S.gems>=20){S.gems-=20;let choices=[1,2,3],pick=choices[Math.floor(Math.random()*choices.length)];if(pick===3&&S.level<100)pick=1;S.owned[pick]=true;S.equipped=pick;S.missions.gacha++;toast("🎉 "+skins[pick].name+" 획득!")}else toast("보석이 부족해요! 상점에서 구매하세요.");save();render();tab("gacha")}
};
let last=S.last||Date.now(),elapsed=Math.min(8*3600,Math.max(0,(Date.now()-last)/1000));if(elapsed>5){let reward=elapsed*rate();earnCoins(reward);$("offline").textContent=`다시 만나서 반가워요! 자리를 비운 ${Math.floor(elapsed/60)}분 동안 ${fmt(reward)} 코인을 모았어요.`;save()}
render();tab("character");updateAccountButton();setInterval(()=>{let r=rate();earnCoins(r);addXP(Math.max(1,Math.floor(r/20)));save();render()},1000);
</script></body></html>
